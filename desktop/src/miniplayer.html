<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MattLab MiniPlayer</title>
  <style>
    :root {
      --brand: #22c55e;
      --brand-hover: #4ade80;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      padding: 3px; /* Vital: gives DWM border space so roundness isn't clipped square */
    }

    /* Entire window card is draggable across desktop */
    .mini-card {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      isolation: isolate;
      /* Frosted glass background over external desktop applications */
      background: rgba(18, 18, 18, 0.72);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 14px;
      transition: background 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
      -webkit-app-region: drag; /* Draggable everywhere by default */
      cursor: grab;
    }

    .mini-card:active {
      cursor: grabbing;
    }

    /* ONLY actual buttons, inputs, and interactive controls capture mouse clicks */
    button, input, .interactive-btn {
      -webkit-app-region: no-drag !important;
      cursor: pointer !important;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      pointer-events: none; /* Let drag pass through */
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
      pointer-events: none;
    }

    .cover-art-container {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      overflow: hidden;
      background: #242424;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover-fallback {
      width: 20px;
      height: 20px;
      color: rgba(255, 255, 255, 0.4);
    }

    .track-text {
      min-width: 0;
      flex: 1;
      pointer-events: none;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .artist {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      pointer-events: auto; /* Re-enable for the buttons */
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .icon-btn.close-btn:hover {
      background: rgba(239, 68, 68, 0.8);
      color: #ffffff;
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Lyrics Display - 100% draggable */
    .lyrics-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 3px 0;
      min-width: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .lyrics-current {
      font-size: 13px;
      font-weight: 800;
      color: var(--brand);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      line-height: 1.3;
    }

    .lyrics-upcoming {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      margin-top: 2px;
    }

    /* Bottom row: Timeline scrubber & Controls */
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-bar-container {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--brand);
      border-radius: 4px;
      transition: width 0.15s linear;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      pointer-events: auto;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.8);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.18);
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .play-btn {
      background: #ffffff;
      color: #000000;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .play-btn:hover {
      transform: scale(1.08);
      background: var(--brand);
    }

    .play-btn:active {
      transform: scale(0.94);
    }

    .play-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="mini-card" id="miniCard">
    <!-- Top Row: Cover, Info, Controls -->
    <div class="top-row">
      <div class="track-meta">
        <div class="cover-art-container">
          <img src="" alt="" class="cover-art" id="coverArt" style="display: none;">
          <svg class="cover-fallback" id="coverFallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="track-text">
          <div class="title" id="trackTitle">No Track Playing</div>
          <div class="artist" id="artistName">MattLab Music</div>
        </div>
      </div>

      <div class="top-actions">
        <!-- Reversible Back to App / Return to Previous Window -->
        <button class="icon-btn interactive-btn" id="focusBtn" title="Toggle Main Window (Focus / Return to Previous)" onclick="handleToggleMainApp(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
        <!-- Close MiniPlayer -->
        <button class="icon-btn close-btn interactive-btn" title="Close Miniplayer" onclick="handleClose(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- Center Lyrics (Fully Draggable) -->
    <div class="lyrics-area">
      <div class="lyrics-current" id="currentLyric">♪ MattLab Music</div>
      <div class="lyrics-upcoming" id="upcomingLyric">Ready to play</div>
    </div>

    <!-- Bottom Controls & Timeline -->
    <div class="bottom-row">
      <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="controls">
        <button class="ctrl-btn interactive-btn" title="Previous Track" onclick="handleAction(event, 'prev')">
          <svg viewBox="0 0 24 24" width="13" height="13"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="play-btn interactive-btn" id="playBtn" title="Play/Pause" onclick="handleTogglePlay(event)">
          <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        </button>
        <button class="ctrl-btn interactive-btn" title="Next Track" onclick="handleAction(event, 'next')">
          <svg viewBox="0 0 24 24" width="13" height="13"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const coverArt = document.getElementById('coverArt');
    const coverFallback = document.getElementById('coverFallback');
    const trackTitle = document.getElementById('trackTitle');
    const artistName = document.getElementById('artistName');
    const currentLyric = document.getElementById('currentLyric');
    const upcomingLyric = document.getElementById('upcomingLyric');
    const progressFill = document.getElementById('progressFill');
    const playBtn = document.getElementById('playBtn');
    const miniCard = document.getElementById('miniCard');

    let isPlaying = false;
    let lastActionTimestamp = 0;

    coverArt.onerror = () => {
      coverArt.style.display = 'none';
      coverFallback.style.display = 'block';
    };

    function renderPlayState(playing) {
      isPlaying = playing;
      playBtn.innerHTML = playing
        ? `<svg viewBox="0 0 24 24" width="14" height="14"><rect x="6" y="4" width="4" height="16" fill="black"/><rect x="14" y="4" width="4" height="16" fill="black"/></svg>`
        : `<svg viewBox="0 0 24 24" width="14" height="14"><polygon points="6 4 20 12 6 20 6 4" fill="black"/></svg>`;
    }

    function handleTogglePlay(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      const now = Date.now();
      if (now - lastActionTimestamp < 150) return; // Prevent double trigger
      lastActionTimestamp = now;

      // Optimistic update
      renderPlayState(!isPlaying);
      window.miniPlayerAPI?.sendAction('togglePlay');
    }

    function handleAction(e, action) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      window.miniPlayerAPI?.sendAction(action);
    }

    function handleToggleMainApp(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      window.miniPlayerAPI?.focusMainApp();
    }

    function handleClose(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      window.miniPlayerAPI?.close();
    }

    // Listen for live state updates dispatched from main window
    window.miniPlayerAPI?.onStateUpdate((state) => {
      if (!state) return;

      if (state.track) {
        trackTitle.textContent = state.track.title || 'Unknown Title';
        artistName.textContent = state.track.artist_name || 'Unknown Artist';
        if (state.track.cover_url) {
          coverArt.src = state.track.cover_url;
          coverArt.style.display = 'block';
          coverFallback.style.display = 'none';
        } else {
          coverArt.style.display = 'none';
          coverFallback.style.display = 'block';
        }
      }

      // Sync play state
      if (typeof state.isPlaying === 'boolean') {
        renderPlayState(state.isPlaying);
      }

      if (state.duration > 0) {
        const pct = Math.min(100, Math.max(0, (state.currentTime / state.duration) * 100));
        progressFill.style.width = `${pct}%`;
      } else {
        progressFill.style.width = '0%';
      }

      if (state.currentLyric) {
        currentLyric.textContent = state.currentLyric;
      }
      if (state.upcomingLyric) {
        upcomingLyric.textContent = state.upcomingLyric;
      }

      if (state.opacity) {
        const alpha = Math.max(0.2, Math.min(1.0, state.opacity / 100));
        miniCard.style.background = `rgba(18, 18, 18, ${alpha * 0.78})`;
        miniCard.style.opacity = `${alpha}`;
      }
    });
  </script>
</body>
</html>
